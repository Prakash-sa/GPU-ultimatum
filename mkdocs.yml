site_name: GPU Ultimatum
site_description: Notes on GPU programming and GPU hardware reference sheets
site_url: https://prakash-sa.github.io/GPU-ultimatum/
repo_url: https://github.com/Prakash-sa/GPU-ultimatum
repo_name: Prakash-sa/GPU-ultimatum
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - content.action.edit
  font:
    text: Comic Neue
    code: Space Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - javascripts/external-links.js
  - javascripts/reading.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

exclude_docs: |
  __pycache__/
  trace_*.json

nav:
  - Home: index.md
  - GPU spec sheets: gpu-spec-sheets.md
  - GPU programming notes:
      - Overview: notes/index.md
      - 1. Execution model: notes/01-execution-model.md
      - 2. Memory hierarchy: notes/02-memory-hierarchy.md
      - 3. Performance optimization: notes/03-performance.md
      - 4. Streams and concurrency: notes/04-streams.md
      - 5. Multi-GPU and NCCL: notes/05-multi-gpu.md
      - 6. Profiling and debugging: notes/06-profiling.md
      - 7. GPU from Python: notes/07-python.md
      - 8. Programming with Triton: notes/08-triton.md
      - 9. Optimization strategies: notes/09-optimization-strategies.md
      - 10. How GPUs talk to each other: notes/10-multi-gpu-communication.md
